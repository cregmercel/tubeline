[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 512, depth = 64 }

# Elysium (destination): mainnet 99901, testnet 99801. Robinhood Chain (4663) is a source chain.
[rpc_endpoints]
elysium = "${RPC_ELYSIUM}"
elysium_testnet = "${RPC_ELYSIUM_TESTNET}"
ethereum = "${RPC_ETHEREUM}"
arbitrum = "${RPC_ARBITRUM}"
base = "${RPC_BASE}"
robinhood = "${RPC_ROBINHOOD}"

# Elysium's explorer is Blockscout-compatible (no API key needed).
[etherscan]
elysium = { key = "any", url = "https://elysium.kinetiq.xyz/api", chain = 99901 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
