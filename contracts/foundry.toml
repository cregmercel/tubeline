[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 512, depth = 64 }

[rpc_endpoints]
robinhood = "${RPC_ROBINHOOD}"
robinhood_testnet = "${RPC_ROBINHOOD_TESTNET}"
ethereum = "${RPC_ETHEREUM}"
arbitrum = "${RPC_ARBITRUM}"
base = "${RPC_BASE}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
